<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>layout check running</title>
<style>
html,body{margin:0;background:#1b1f1d;color:#e9efe9;font:12px/1.5 Arial,sans-serif}
.row{display:flex;gap:18px;padding:14px;align-items:flex-start}
.dev{background:#0b1614;border:1px solid #35544b;padding:8px}
.dev b{display:block;font-size:11px;letter-spacing:.08em;color:#8fb4a6;margin-bottom:6px}
iframe{border:0;display:block;background:#fff}
#out{white-space:pre;font:12px/1.6 monospace;color:#cfe0d5;padding:6px 14px 18px}
</style></head>
<body>
<div class="row">
  <div class="dev"><b id="label">390 × 844</b><iframe id="site" width="390" height="844" src="./index.html?lang=en"></iframe></div>
</div>
<div id="out">measuring…</div>
<script>
(function(){
  var KEY='nextab_th1_unlocked_v1';
  var f=document.getElementById('site');
  var out=document.getElementById('out');
  var label=document.getElementById('label');
  var results={};

  function measure(w){
    var doc=f.contentDocument, de=doc.documentElement;
    var over=de.scrollWidth-de.clientWidth;
    var worst=null,max=0;
    var els=doc.querySelectorAll('body *');
    for(var i=0;i<els.length;i++){
      var r=els[i].getBoundingClientRect();
      if(r.right>de.clientWidth+1&&r.width>max){max=r.width;worst=els[i].className||els[i].tagName;}
    }
    results[w]={overflow:over,widest:max?Math.round(max):0,el:String(worst||'').slice(0,40)};
    out.textContent=JSON.stringify(results,null,1);
  }

  f.addEventListener('load',function(){
    try{f.contentWindow.sessionStorage.setItem(KEY,'1');}catch(e){}
    f.contentWindow.location.reload();
  },{once:true});

  f.addEventListener('load',function(){
    var widths=[1440,1024,768,414,390,360];
    var i=0;
    (function next(){
      if(i>=widths.length){
        f.width=390;f.height=844;label.textContent='390 × 844';
        setTimeout(function(){
          var doc=f.contentDocument;
          var el=doc.querySelector('.mechvisual');
          f.contentWindow.scrollTo({top:Math.round(el.getBoundingClientRect().top+f.contentWindow.scrollY-70),behavior:'instant'});
          document.title='check done';
        },1200);
        return;
      }
      var w=widths[i++];
      f.width=w;f.height=844;
      setTimeout(function(){measure(w);next();},1400);
    })();
  },{once:true});
})();
</script>
</body></html>
